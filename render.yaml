# ─── Render blueprint for TruthVortex ──────────────────────────────────────
# Deploys: managed Postgres + FastAPI web service + scheduled scraper cron.
# Frontend (Next.js) is deployed separately on Vercel — see README.
#
# After first deploy, set the secret/env values marked `sync: false` in the
# Render dashboard (NVIDIA_API_KEY, and CORS_ALLOW_ORIGINS = your Vercel URL).

databases:
  - name: truthvortex-db
    databaseName: newsdb
    plan: free

services:
  # ─── API ────────────────────────────────────────────────────────────────
  - type: web
    name: truthvortex-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: truthvortex-db
          property: connectionString
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false   # e.g. https://your-app.vercel.app

  # ─── Scraper (runs every 30 min) ─────────────────────────────────────────
  - type: cron
    name: truthvortex-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    schedule: "*/30 * * * *"
    dockerCommand: python scraper.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: truthvortex-db
          property: connectionString
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SAFE_IMAGES_ONLY
        value: "false"
      - key: MAX_CONCURRENT_SOURCES
        value: "5"
